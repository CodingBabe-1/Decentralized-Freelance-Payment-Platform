name: PR title

# Validates pull request titles against Conventional Commits (issue #288) so the
# history stays parseable by semantic-release and changelog tooling.
#
# `pull_request_target` is used instead of `pull_request` so the check also runs
# for PRs opened from forks. No repository code is checked out or executed here;
# only the event payload is read.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# Read-only, as required by `backend/src/__tests__/ciWorkflows.test.ts`.
permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # Dependabot titles are generated by the bot and already carry the prefixes
    # configured in `.github/dependabot.yml`; a human is not editing them.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          # Scopes are recommended but not mandatory (e.g. `fix(backend): ...`
          # and `fix: ...` are both valid).
          requireScope: false
          # Sentence-style subject: lowercase first letter, no trailing period.
          # See CONTRIBUTING.md → Pull request titles.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must start with a lowercase character and must not end with a period.
          errorMessage: |
            The pull request title does not follow Conventional Commits.

            Expected format: <type>(<scope>): <subject>
            Example:         fix(backend): reject expired milestones

            Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore

            See CONTRIBUTING.md → Pull request titles.
