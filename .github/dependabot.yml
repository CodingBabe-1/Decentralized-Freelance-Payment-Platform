# Automated dependency updates (issue #285).
#
# Security fixes land as individual PRs; routine version bumps are grouped so a
# week of minor/patch releases produces one reviewable PR per ecosystem instead
# of a dozen. Major version bumps stay ungrouped because each one needs its own
# migration decision.
#
# PR titles are prefixed so they pass the Conventional Commits title check in
# `.github/workflows/pr-lint.yml` (dependabot[bot] is also exempted there).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Root package: Husky / lint-staged and the Playwright end-to-end suite.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      root-security:
        applies-to: security-updates
        patterns:
          - "*"
      root-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      contracts-security:
        applies-to: security-updates
        patterns:
          - "*"
      contracts-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
